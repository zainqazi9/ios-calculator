<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="calculator2.css">
</head>

<body>

<div class="calculator">
    <input id="input" type="text" readonly>

    <!-- Row 1 -->
    <div class="row text-center">
        <div class="col-3"><button class="btn btn-clear w-100" onclick="clearinput()">C</button></div>
        <div class="col-3"><button class="btn btn-clear w-100" onclick="backspace()">⌫</button></div>
        <div class="col-3"><button class="btn btn-clear w-100" onclick="getdata('%')">%</button></div>
        <div class="col-3"><button class="btn btn-operator w-100" onclick="getdata('/')">÷</button></div>
    </div>

    <!-- Row 2 -->
    <div class="row text-center">
        <div class="col-3"><button class="btn btn-number w-100" onclick="getdata('7')">7</button></div>
        <div class="col-3"><button class="btn btn-number w-100" onclick="getdata('8')">8</button></div>
        <div class="col-3"><button class="btn btn-number w-100" onclick="getdata('9')">9</button></div>
        <div class="col-3"><button class="btn btn-operator w-100" onclick="getdata('*')">×</button></div>
    </div>

    <!-- Row 3 -->
    <div class="row text-center">
        <div class="col-3"><button class="btn btn-number w-100" onclick="getdata('4')">4</button></div>
        <div class="col-3"><button class="btn btn-number w-100" onclick="getdata('5')">5</button></div>
        <div class="col-3"><button class="btn btn-number w-100" onclick="getdata('6')">6</button></div>
        <div class="col-3"><button class="btn btn-operator w-100" onclick="getdata('-')">−</button></div>
    </div>

    <!-- Row 4 -->
    <div class="row text-center">
        <div class="col-3"><button class="btn btn-number w-100" onclick="getdata('1')">1</button></div>
        <div class="col-3"><button class="btn btn-number w-100" onclick="getdata('2')">2</button></div>
        <div class="col-3"><button class="btn btn-number w-100" onclick="getdata('3')">3</button></div>
        <div class="col-3"><button class="btn btn-operator w-100" onclick="getdata('+')">+</button></div>
    </div>

    <!-- Row 5 -->
    <div class="row text-center">
        <div class="col-6"><button class="btn btn-number btn-zero" onclick="getdata('0')">0</button></div>
        <div class="col-3"><button class="btn btn-number w-100" onclick="getdata('.')">.</button></div>
        <div class="col-3"><button class="btn btn-operator w-100" onclick="final()">=</button></div>
    </div>
</div>

<script src="calculator.js"></script>

</body>
</html>
